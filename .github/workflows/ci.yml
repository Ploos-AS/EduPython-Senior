name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing tools
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended fonts-dejavu-core epubcheck
      - name: Validate course and examples
        run: make check
      - name: Build web editions
        run: make web
      - name: Build EPUB editions
        run: make epub
      - name: Validate EPUB standard compliance
        run: |
          epubcheck dist/EduPython-Senior-NO.epub
          epubcheck dist/EduPython-Senior-EN.epub
      - name: Validate Kindle profile
        run: make kindle
      - name: Build Norwegian PDF
        id: pdf_no
        continue-on-error: true
        run: |
          make dist/EduPython-Senior-NO.pdf > pdf-no.log 2>&1
      - name: Build English PDF
        id: pdf_en
        continue-on-error: true
        run: |
          make dist/EduPython-Senior-EN.pdf > pdf-en.log 2>&1
      - name: Upload PDF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-diagnostics
          path: |
            pdf-no.log
            pdf-en.log
      - name: Require PDF builds
        if: steps.pdf_no.outcome != 'success' || steps.pdf_en.outcome != 'success'
        run: exit 1
      - name: Verify EPUB and PDF artifacts
        run: |
          test -s dist/web/no/index.html
          test -s dist/web/en/index.html
          test -s dist/web/style.css
          test -s dist/EduPython-Senior-NO.epub
          test -s dist/EduPython-Senior-EN.epub
          test -s dist/EduPython-Senior-NO.pdf
          test -s dist/EduPython-Senior-EN.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: edupython-senior-books
          path: |
            dist/*.epub
            dist/*.pdf
            dist/web/
          if-no-files-found: error
