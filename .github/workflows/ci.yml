name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing tools
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Validate course and examples
        run: make check
      - name: Build EPUB editions
        run: make epub
      - name: Verify EPUB artifacts
        run: |
          test -s dist/EduPython-Senior-NO.epub
          test -s dist/EduPython-Senior-EN.epub
      - uses: actions/upload-artifact@v4
        with:
          name: edupython-senior-epub
          path: dist/*.epub
          if-no-files-found: error
