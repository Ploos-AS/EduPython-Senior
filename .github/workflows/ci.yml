name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing tools
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended fonts-dejavu-core epubcheck
      - name: Validate course and examples
        run: make check
      - name: Build web editions
        run: make web
      - name: Build EPUB editions
        run: make epub
      - name: Validate EPUB standard compliance
        run: |
          epubcheck dist/EduPython-Senior-NO.epub
          epubcheck dist/EduPython-Senior-EN.epub
      - name: Validate Kindle profile
        run: make kindle
      - name: Diagnose Norwegian PDF baseline
        run: |
          mkdir -p dist
          INPUTS="$(python3 tools/book_inputs.py no | tr ' ' '\n' | grep -v '/m08/' | tr '\n' ' ')"
          pandoc --metadata-file=book/no.yaml --toc --pdf-engine=xelatex -V papersize:a4 -V geometry:margin=25mm -V fontsize=12pt -V linestretch=1.15 -V mainfont="DejaVu Serif" -V monofont="DejaVu Sans Mono" -o dist/no-baseline.pdf $INPUTS
      - name: Diagnose Norwegian PDF through M8.4
        run: |
          INPUTS="$(python3 tools/book_inputs.py no | tr ' ' '\n' | sed '/\/m08\/05-/,$d' | tr '\n' ' ')"
          pandoc --metadata-file=book/no.yaml --toc --pdf-engine=xelatex -V papersize:a4 -V geometry:margin=25mm -V fontsize=12pt -V linestretch=1.15 -V mainfont="DejaVu Serif" -V monofont="DejaVu Sans Mono" -o dist/no-through-m8-4.pdf $INPUTS
      - name: Build Norwegian PDF
        run: make dist/EduPython-Senior-NO.pdf
      - name: Build English PDF
        run: make dist/EduPython-Senior-EN.pdf
      - name: Verify EPUB and PDF artifacts
        run: |
          test -s dist/web/no/index.html
          test -s dist/web/en/index.html
          test -s dist/web/style.css
          test -s dist/EduPython-Senior-NO.epub
          test -s dist/EduPython-Senior-EN.epub
          test -s dist/EduPython-Senior-NO.pdf
          test -s dist/EduPython-Senior-EN.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: edupython-senior-books
          path: |
            dist/*.epub
            dist/*.pdf
            dist/web/
          if-no-files-found: error
